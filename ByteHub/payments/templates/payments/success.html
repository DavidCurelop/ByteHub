{% extends "base.html" %}
{% load i18n %}

{% block content %}

<style>
.success-wrapper {
    min-height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.success-card {
    background: white;
    padding: 50px;
    border-radius: 20px;
    text-align: center;
    max-width: 550px;
    width: 90%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.success-icon {
    font-size: 80px;
    margin-bottom: 20px;
}

.success-title {
    font-size: 42px;
    color: #0a2540;
    margin-bottom: 15px;
}

.success-text {
    font-size: 18px;
    color: #555;
    margin-bottom: 35px;
    line-height: 1.6;
}

.success-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.success-btn {
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: bold;
    transition: 0.3s ease;
}

.primary-btn {
    background-color: #00c2cb;
    color: white;
}

.primary-btn:hover {
    background-color: #00a7af;
}

.secondary-btn {
    border: 2px solid #0a2540;
    color: #0a2540;
}

.secondary-btn:hover {
    background-color: #0a2540;
    color: white;
}
</style>

<div class="success-wrapper">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>

        <h1 class="success-title">
            {% trans "Payment Successful" %}
        </h1>

        <p class="success-text">
            {% blocktrans %}Your payment was processed successfully.
            Thank you for shopping with ByteHub.{% endblocktrans %}
        </p>

        <div class="success-buttons">

            <a href="{% url 'pages:home' %}" class="success-btn primary-btn">
                {% trans "Go Home" %}
            </a>

            <a href="{% url 'orders:order-list' %}" class="success-btn secondary-btn">
                {% trans "View Orders" %}
            </a>

        </div>

    </div>

</div>

{% endblock %}
