services:
  postgres:
    image: postgres:16-alpine
    container_name: bytehub_postgres
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytehub}
      POSTGRES_USER: ${POSTGRES_USER:-bytehub_user}
      # Dev default so any teammate can run docker compose without extra setup.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytehub_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bytehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytehub_user} -d ${POSTGRES_DB:-bytehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
    - path: .env
      required: false

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key}
      DEBUG: ${DEBUG:-true}
      USE_POSTGRES: ${USE_POSTGRES:-true}
      POSTGRES_DB: ${POSTGRES_DB:-bytehub}
      POSTGRES_USER: ${POSTGRES_USER:-bytehub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytehub_dev_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      LOAD_FIXTURE_DATA: ${LOAD_FIXTURE_DATA:-true}

    ports:
      - "8000:8000"

    working_dir: /app/ByteHub

    volumes:
    - .:/app