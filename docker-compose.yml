services:
  postgres:
    image: postgres:16-alpine
    container_name: bytehub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytehub}
      POSTGRES_USER: ${POSTGRES_USER:-bytehub_user}
      # Dev default so any teammate can run docker compose without extra setup.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytehub_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bytehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytehub_user} -d ${POSTGRES_DB:-bytehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key}
      DEBUG: ${DEBUG:-true}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytehub_dev_password}
      # Override Postgres connection to use Docker internal hostname
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "60"
      # Force Postgres; the web service always runs alongside the postgres
      # service so SQLite would be inconsistent with the Compose setup.
      USE_POSTGRES: "true"
      # Load fixture data from dev_seed.json
      LOAD_FIXTURE_DATA: "true"
    ports:
      - "8000:8000"
    working_dir: /app/ByteHub

volumes:
  bytehub_postgres_data:
    # Explicit volume name keeps one shared DB per Docker host.
    name: bytehub_shared_postgres_data